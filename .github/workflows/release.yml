name: Release

# A tag like v0.1.0-alpha1 builds SempreUI.zip and uploads it to GitHub,
# CurseForge and Wago. Tags with "alpha" or "beta" are marked as such.
# The CurseForge and Wago project IDs are read from Sempre/Sempre.toc.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/run.lua

      - name: Package and upload
        uses: BigWigsMods/packager@v2
