name: Release

# A release starts when CHANGELOG.md on main gets a new top entry
# "## v<version>". The workflow tags that commit, builds SempreUI.zip and
# uploads it to GitHub, CurseForge and Wago. Versions with "alpha" or "beta"
# are marked as such. The CurseForge and Wago project IDs are read from
# Sempre/Sempre.toc. Pushing a tag v* by hand works as well.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md, .github/workflows/release.yml]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag the new changelog version
        if: github.ref_type == 'branch'
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 -oE '^## v[0-9A-Za-z.+-]+' CHANGELOG.md | cut -c4-)
          if [ -z "$version" ] || gh release view "$version" >/dev/null 2>&1; then
            echo "No unreleased version in CHANGELOG.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            git config user.name SempreUI
            git config user.email SempreUI@users.noreply.github.com
            git tag -a "$version" -m "SempreUI $version"
            git push origin "$version"
          fi
          git checkout -q "$version"

      - if: steps.tag.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - if: steps.tag.outputs.skip != 'true'
        run: lua5.1 tests/run.lua

      # The BigWigs packager. Run without GITHUB_ACTIONS, because on a branch
      # push it would otherwise wait for a separate run for the new tag, and
      # a tag pushed with the workflow token starts no new run.
      - name: Package and upload
        if: steps.tag.outputs.skip != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/release.sh" https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh
          env -u GITHUB_ACTIONS bash "$RUNNER_TEMP/release.sh"
